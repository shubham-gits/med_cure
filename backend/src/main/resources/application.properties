server.port=4001

# H2 file-based database — creates a file under ./data/, no separate DB server needed.
spring.datasource.url=jdbc:h2:file:./data/medbookdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Optional: browse the DB at http://localhost:4001/h2-console while the app is running
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT secret — CHANGE THIS before deploying anywhere public. Must be at least 32
# characters (256 bits) for the HS256 algorithm used in JwtUtil.
jwt.secret=change-this-to-a-long-random-secret-string-before-deploying
jwt.expiration-ms=604800000
